<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matutinas Maranata</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; line-height: 1.6; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 20px; margin-top: 15px; }
    h1 { color: #4caf50; font-size: 1.4rem; }
    .verso { font-style: italic; color: #bb86fc; margin-bottom: 10px; }
    .ref { font-weight: bold; color: #03dac6; }
    button { background: #4caf50; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <div id="current-date" style="color: #888; font-size: 0.9rem;"></div>
    <h1 id="devotional-title">Cargando...</h1>
    <p class="verso" id="bible-text"></p>
    <p class="ref" id="bible-ref"></p>
    <hr style="border-color: #333; margin: 15px 0;">
    <div id="reflection"></div>
    <p style="margin-top: 15px; font-weight: bold;" id="prayer"></p>
    <p style="color: #888; font-size: 0.85rem;" id="author"></p>
    <button id="read-btn" onclick="markAsRead()">✓ MARCAR COMO LEÍDA</button>
  </div>

  <!-- Enlace con el archivo JavaScript -->
  <script src="matutinasMRNTjava.js"></script>
</body>
</html>
