<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matutinas Adventistas para Maranata</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --primary: #2b580c;
      --primary-light: #639a67;
      --accent: #d8a04e;
      --text-dark: #2c3e50;
      --text-muted: #666666;
      --shadow: 0 4px 15px rgba(0,0,0,0.08);
      --radius: 16px;
    }

    body.dark-mode {
      --bg-color: #12181b;
      --card-bg: #1e262c;
      --primary: #639a67;
      --primary-light: #2b580c;
      --accent: #f1c40f;
      --text-dark: #e0e6ed;
      --text-muted: #a0aec0;
      --shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-dark); display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 480px; background: var(--bg-color); display: flex; flex-direction: column; min-height: 100vh; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px 0 20px; }
    .streak-badge { background: var(--card-bg); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; box-shadow: var(--shadow); }
    .theme-toggle { background: none; border: none; font-size: 1.3rem; cursor: pointer; }
    header { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; padding: 20px; text-align: center; border-bottom-left-radius: var(--radius); border-bottom-right-radius: var(--radius); margin-top: 8px; }
    header h1 { font-size: 1.05rem; text-transform: uppercase; margin-bottom: 4px; font-weight: 700; }
    header p { font-size: 0.85rem; font-style: italic; opacity: 0.95; }
    main { padding: 20px; flex: 1; padding-bottom: 80px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .date-badge { text-align: center; font-size: 0.95rem; font-weight: 600; color: var(--accent); margin-bottom: 15px; text-transform: capitalize; }
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); margin-bottom: 20px; }
    .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .card-subtitle { font-size: 0.8rem; font-weight: bold; color: var(--primary); text-transform: uppercase; }
    .fav-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; }
    .card-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 15px; line-height: 1.3; }
    .bible-box { background: rgba(99, 154, 103, 0.12); border-left: 4px solid var(--primary); padding: 12px 15px; border-radius: 6px; margin-bottom: 18px; }
    .bible-text { font-size: 0.95rem; font-style: italic; line-height: 1.5; margin-bottom: 6px; }
    .bible-ref { font-size: 0.85rem; font-weight: bold; text-align: right; color: var(--primary); }
    .section-title { font-size: 1rem; font-weight: 600; margin-top: 15px; margin-bottom: 8px; }
    .reflection-text, .prayer-text { font-size: 0.95rem; line-height: 1.6; margin-bottom: 15px; }
    .author-tag { font-size: 0.85rem; color: var(--text-muted); text-align: right; font-style: italic; }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius); font-size: 0.95rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background-color: var(--primary); color: white; }
    .btn-primary.completed { background-color: #27ae60; }
    .btn-secondary { background-color: transparent; border: 1.5px solid var(--primary); color: var(--primary); }
    .search-input, .date-picker { width: 100%; padding: 12px 16px; border-radius: var(--radius); border: 1px solid rgba(0,0,0,0.15); background: var(--card-bg); color: var(--text-dark); font-size: 1rem; margin-bottom: 15px; }
    .list-item { background: var(--card-bg); padding: 15px; border-radius: var(--radius); margin-bottom: 10px; box-shadow: var(--shadow); cursor: pointer; }
    .list-item h4 { color: var(--primary); margin-bottom: 4px; }
    .list-item p { font-size: 0.85rem; color: var(--text-muted); }
    nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: var(--card-bg); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid rgba(0,0,0,0.08); }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; color: var(--text-muted); cursor: pointer; }
    .nav-item.active { color: var(--primary); font-weight: bold; }
    .nav-item span { font-size: 1.2rem; margin-bottom: 2px; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="top-bar">
    <div class="streak-badge" id="streak-count">🔥 0 Días</div>
    <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🌙</button>
  </div>

  <header>
    <h1>Matutinas Adventistas para Maranata</h1>
    <p>“Cada mañana, un encuentro con Dios.” 🌅</p>
  </header>

  <main>
    <div id="tab-inicio" class="tab-content active">
      <div class="date-badge" id="current-date">---</div>
      <div class="card">
        <div class="card-header-flex">
          <div class="card-subtitle">📖 MATUTINA DE HOY</div>
          <button class="fav-btn" id="fav-btn" onclick="toggleFavorite()">🔖</button>
        </div>
        <h2 class="card-title" id="devotional-title">---</h2>
        <div class="bible-box">
          <p class="bible-text" id="bible-text">"---"</p>
          <div class="bible-ref" id="bible-ref">---</div>
        </div>
        <div class="section-title">💭 Reflexión</div>
        <p class="reflection-text" id="reflection">---</p>
        <div class="section-title">🙏 Oración</div>
        <p class="prayer-text" id="prayer">---</p>
        <div class="author-tag" id="author">✍️ ---</div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="read-btn" onclick="markAsRead()">✓ MARCAR COMO LEÍDA</button>
        <button class="btn btn-secondary" onclick="shareContent()">📤 Compartir</button>
      </div>
    </div>

    <div id="tab-calendario" class="tab-content">
      <h3 style="margin-bottom: 15px;">📅 Selecciona una fecha</h3>
      <input type="date" id="calendar-picker" class="date-picker" onchange="selectDateFromCalendar(this.value)">
    </div>

    <div id="tab-buscar" class="tab-content">
      <h3 style="margin-bottom: 15px;">🔎 Buscar Matutinas</h3>
      <input type="text" class="search-input" placeholder="Buscar por palabra, verso o título..." oninput="searchDevotionals(this.value)">
      <div id="search-results"></div>
    </div>

    <div id="tab-favoritas" class="tab-content">
      <h3 style="margin-bottom: 15px;">❤️ Mis Favoritas</h3>
      <div id="favorites-list"></div>
    </div>
  </main>

  <nav>
    <div class="nav-item active" onclick="switchTab('inicio', this)"><span>🏠</span>Inicio</div>
    <div class="nav-item" onclick="switchTab('calendario', this)"><span>📅</span>Calendario</div>
    <div class="nav-item" onclick="switchTab('buscar', this)"><span>🔎</span>Buscar</div>
    <div class="nav-item" onclick="switchTab('favoritas', this)"><span>🔖</span>Favoritas</div>
  </nav>
</div>

<script src="matutina.js"></script>
</body>
</html>
